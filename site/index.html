<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bunni: How We First Met</title>
<meta name="description" content="Play the preserved Bunni: How We First Met in your browser, patched for its original frame rate.">
<style>
  :root { color-scheme: light dark; --bg:#1b1b1f; --fg:#e8e6e3; --muted:#aaa69d; --link:#9cc3ff; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f2ee; --fg:#232323; --muted:#6b675f; --link:#2457a6; } }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--fg); font:14px system-ui,sans-serif; }
  #wrap { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; gap:8px; padding:8px 16px; box-sizing:border-box; }
  #player { position:relative; width:min(100%,calc((100vh - 64px)*4/3)); aspect-ratio:4/3; background:#000; }
  #player ruffle-player { width:100%; height:100%; display:block; }
  #loading { position:absolute; inset:0; z-index:1; display:grid; place-content:center; padding:24px; text-align:center; color:#eee; background:#17191d; line-height:1.7; }
  #loading[hidden] { display:none; }
  #loading button { margin:16px auto; padding:8px 18px; font:inherit; cursor:pointer; }
  #hud { color:var(--muted); font:12px ui-monospace,monospace; min-height:1em; }
  footer { max-width:900px; color:var(--muted); font-size:12px; text-align:center; line-height:1.5; }
  footer a { color:var(--link); }
</style>
</head>
<body>
<main id="wrap">
  <div id="player">
    <div id="loading" role="status"><span id="load-message">Loading Bunni from the Internet Archive...</span><button id="retry" hidden>Try again</button></div>
  </div>
  <div id="hud" hidden></div>
  <footer>
    <span id="which">Patched for its original 30 fps.</span> &middot;
    <a href="https://archive.org/details/bunnibunni">Preserved by the Internet Archive</a> &middot; LunaDrift, 2009 &middot;
    <a href="https://ruffle.rs">Ruffle</a> &middot;
    Saves stay in this browser. Use Save to export a backup.
  </footer>
</main>
<script src="ruffle/ruffle.js?build=ccbb9c2f4e1dccf0"></script>
<script src="patcher.js"></script>
<script src="player.js?v=20261103-render-cache"></script>
</body>
</html>
